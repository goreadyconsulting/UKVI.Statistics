name: Deploy UKVI dashboard and refresh public statistics

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build public site
        run: |
          python -m pip install --disable-pip-version-check openpyxl==3.1.5 beautifulsoup4==4.13.4
          mkdir -p _site
          cp index.html explore.html _site/
          python scripts/sync_public.py _site/public-data
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload validated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
